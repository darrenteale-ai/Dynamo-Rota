version: "3.8"

# Self-hosting on your own server/VPS. For Railway/Render, skip this file
# entirely and follow the README instead — they build straight from the
# Dockerfiles without needing compose.

services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - rota-data:/app/data
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Must be reachable from staff members' browsers — not "backend" or "localhost"
        # unless you're only ever testing on the same machine. See README.
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rota-data:
